<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — Fleetwork Basketball</title>
<meta name="description" content="Fleetwork Basketball roster and coaching staff.">
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0B; --bg-panel: #131315; --bg-panel-2: #19191B;
    --orange: #F5601A; --red: #DF0A11;
    --text: #F2EFEA; --text-muted: #96969B;
    --line: rgba(242,239,234,0.10); --line-strong: rgba(242,239,234,0.18);
    --radius: 4px; --maxw: 1120px;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: repeating-linear-gradient(135deg, rgba(245,96,26,0.05) 0px, rgba(245,96,26,0.05) 2px, transparent 2px, transparent 34px), var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  a{ color: inherit; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  :focus-visible{ outline: 2px solid var(--orange); outline-offset: 3px; }

  header.scorebug{ position: sticky; top:0; z-index:50; background: rgba(10,10,11,0.92); backdrop-filter: blur(8px); border-bottom: 3px solid var(--orange); }
  .scorebug-inner{ max-width: var(--maxw); margin:0 auto; padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand img{ height:34px; width:auto; }
  .brand-name{ font-family:'Anton', sans-serif; font-size:17px; letter-spacing:0.02em; }
  nav.primary-nav{ display:flex; gap:22px; }
  nav.primary-nav a{ text-decoration:none; color: var(--text-muted); font-size:13px; font-weight:700; font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.04em; padding:8px 2px; border-bottom:3px solid transparent; transition: color .15s, border-color .15s; white-space:nowrap; }
  nav.primary-nav a:hover{ color: var(--text); border-color: var(--orange); }
  nav.primary-nav a.current{ color: var(--text); border-color: var(--orange); }
  .nav-toggle{ display:none; background:none; border:1px solid var(--line-strong); color: var(--text); padding:8px 10px; border-radius: var(--radius); font-size:20px; line-height:1; }
  @media (max-width: 820px){
    nav.primary-nav{ position:absolute; top:60px; left:0; right:0; background: var(--bg-panel); border-bottom:3px solid var(--orange); flex-direction:column; gap:0; padding:6px 0; display:none; }
    nav.primary-nav.open{ display:flex; }
    nav.primary-nav a{ padding:14px 24px; border-bottom:1px solid var(--line); }
    .nav-toggle{ display:block; }
  }

  .page-head{ padding: 64px 0 40px; border-bottom: 1px solid var(--line); }
  .page-head h1{ font-family:'Anton', sans-serif; font-weight:400; font-size:48px; text-transform:uppercase; letter-spacing:0.01em; margin:0 0 12px; }
  .page-head p{ color: var(--text-muted); margin:0; max-width: 60ch; }

  section{ padding: 64px 0; border-bottom: 1px solid var(--line); }
  section:last-of-type{ border-bottom: none; }
  .section-head{ max-width:640px; margin-bottom:32px; position:relative; padding-left:18px; }
  .section-head::before{ content:""; position:absolute; left:0; top:4px; bottom:4px; width:6px; background: linear-gradient(180deg, var(--orange), var(--red)); }
  .section-head h2{ font-family:'Anton', sans-serif; font-weight:400; font-size:30px; text-transform:uppercase; margin:0 0 8px; }
  .section-head p{ color: var(--text-muted); margin:0; }

  table.roster-table{ width:100%; border-collapse: collapse; }
  table.roster-table th, table.roster-table td{ text-align:left; padding: 12px; border-bottom: 1px solid var(--line); font-size:14px; vertical-align: middle; }
  table.roster-table th{ color: var(--text-muted); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
  table.roster-table tr:hover td{ background: rgba(245,96,26,0.04); }
  .avatar-box{
    width:46px; height:58px; border-radius:6px; overflow:hidden; flex:none;
    background: rgba(245,96,26,0.1); border:1px solid rgba(245,96,26,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar-box img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-box .num-fallback{ font-family:'Anton', sans-serif; font-size:15px; color: var(--orange); }
  .player-name-cell{ display:flex; align-items:center; gap:12px; }
  .player-name-cell .name{ font-weight:600; }
  .player-divisions{ font-size:12px; color: var(--text-muted); margin-top:2px; }
  .muted{ color: var(--text-muted); }

  .roster-division{ margin-bottom:56px; }
  .roster-division:last-child{ margin-bottom:0; }
  .roster-division h3{ font-family:'Anton', sans-serif; font-size:20px; text-transform:uppercase; letter-spacing:0.02em; margin:0 0 16px; }

  .staff-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  .staff-card{ background: var(--bg-panel); border:1px solid var(--line); border-top: 3px solid var(--orange); border-radius: var(--radius); padding:24px 20px; }
  .staff-card:nth-child(even){ border-top-color: var(--red); }
  .staff-avatar{ width:52px; height:52px; border-radius:50%; background: rgba(245,96,26,0.1); border:1px solid rgba(245,96,26,0.35); margin-bottom:14px; }
  .staff-role{ font-size:12px; color: var(--red); font-weight:700; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.04em; }
  .staff-name{ font-weight:600; }
  @media (max-width: 700px){ .staff-grid{ grid-template-columns: 1fr; } }

  footer{ padding: 56px 0 40px; }
  .footer-grid{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:30px; }
  .footer-affil{ max-width:44ch; color: var(--text-muted); font-size:14px; }
  .footer-affil a{ color: var(--orange); text-decoration:none; }
  .footer-contact a{ color: var(--text); text-decoration:none; font-weight:600; }
  .footer-bottom{ margin-top:40px; padding-top:20px; border-top:1px solid var(--line); color: var(--text-muted); font-size:13px; }
</style>
</head>
<body>

<header class="scorebug">
  <div class="scorebug-inner">
    <a class="brand" href="index.html">
      <img src="assets/logo-mark.png" alt="Fleetwork Basketball">
      <span class="brand-name">Fleetwork</span>
    </a>
    <nav class="primary-nav" id="primaryNav">
      <a href="index.html#approach">Approach</a>
      <a href="index.html#runs">Open runs</a>
      <a href="index.html#schedule">Schedule</a>
      <a href="roster.html" class="current">Roster</a>
      <a href="index.html#stats">Stats</a>
      <a href="index.html#highlights">Highlights</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  </div>
</header>

<div class="page-head">
  <div class="wrap">
    <h1>Roster</h1>
  </div>
</div>

<section id="players">
  <div class="wrap">
    <div class="section-head"><h2>Players</h2><p>The whole Fleetwork roster — divisions each player suits up for are listed under their name.</p></div>
    <table class="roster-table">
      <thead><tr><th></th><th>#</th><th>Player</th><th>Ht</th></tr></thead>
      <tbody id="rosterBody"><!-- filled by JS --></tbody>
    </table>
  </div>
</section>

<section id="staff">
  <div class="wrap">
    <div class="section-head"><h2>Coaching staff</h2></div>
    <div class="staff-grid" id="staffGrid"><!-- filled by JS --></div>
  </div>
</section>

<footer id="contact">
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-contact"><a id="contactEmail" href="#"></a></div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> Fleetwork Basketball.</div>
  </div>
</footer>

<script src="config.js"></script>
<script>
  document.getElementById('rosterBody').innerHTML = TEAM.roster.map(p => {
    const avatar = p.photo
      ? `<img src="assets/players/${p.photo}.jpg" alt="${p.name}">`
      : `<span class="num-fallback">${p.num}</span>`;
    const divisions = (p.divisions && p.divisions.length)
      ? p.divisions.join(', ')
      : 'Division TBD';
    return `
      <tr>
        <td><div class="avatar-box">${avatar}</div></td>
        <td class="muted">${p.num}</td>
        <td>
          <div class="player-name-cell">
            <div>
              <div class="name">${p.name}</div>
              <div class="player-divisions">${divisions}</div>
            </div>
          </div>
        </td>
        <td class="muted">${p.ht}</td>
      </tr>`;
  }).join('');

  document.getElementById('staffGrid').innerHTML = TEAM.staff.map(s => `
    <div class="staff-card">
      <div class="staff-avatar"></div>
      <div class="staff-role">${s.role}</div>
      <div class="staff-name">${s.name}</div>
    </div>
  `).join('');

  const emailEl = document.getElementById('contactEmail');
  if (TEAM.contactEmail) { emailEl.href = `mailto:${TEAM.contactEmail}`; emailEl.textContent = TEAM.contactEmail; }
  else { emailEl.href = '#'; emailEl.textContent = 'Add a contact email in config.js'; }
  document.getElementById('year').textContent = new Date().getFullYear();

  const navToggle = document.getElementById('navToggle');
  const primaryNav = document.getElementById('primaryNav');
  navToggle.addEventListener('click', () => {
    const isOpen = primaryNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', String(isOpen));
  });
</script>

</body>
</html>
