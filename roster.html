<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — Fleetwork Basketball</title>
<meta name="description" content="The Fleetwork Basketball roster: every player, their number, height and divisions.">
<meta name="theme-color" content="#09090A">
<meta property="og:title" content="Fleetwork Basketball roster">
<meta property="og:image" content="https://www.fleetworkbasketball.com/assets/team-photo.jpg">
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main>
  <div class="page-hero">
    <div class="wrap">
      <h1 class="title">Roster</h1>
      <p class="lede" id="rosterLede"></p>
      <div class="chips" id="chips" role="group" aria-label="Filter by division"></div>
    </div>
  </div>

  <section class="players" style="padding-top:36px">
    <div class="wrap">
      <div class="player-grid" id="playerGrid"></div>
    </div>
  </section>

  <section class="band" id="staff">
    <div class="wrap">
      <h2 class="title">Staff</h2>
      <div class="staff-row" id="staffRow"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="contact"></footer>

<script src="config.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = FW.esc;

  FW.renderHeader('roster');
  FW.renderFooter();

  var SILHOUETTE =
    '<svg viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice">' +
    '<rect width="100" height="125" fill="#17171B"/>' +
    '<circle cx="50" cy="46" r="21" fill="#2A2A31"/>' +
    '<path d="M6 125 C6 92 26 80 50 80 C74 80 94 92 94 125 Z" fill="#2A2A31"/></svg>';

  function card(p) {
    var photo = p.photo
      ? '<img loading="lazy" src="assets/' + esc(p.photo) + '.jpg" alt="' + esc(p.name) + '">'
      : SILHOUETTE;
    var num = p.num && p.num !== '—' ? '<span class="pcard-num">' + esc(p.num) + '</span>' : '';
    var divisions = p.divisions && p.divisions.length ? p.divisions.join(', ') : 'To be announced';
    return '<article class="pcard">' +
             '<div class="pcard-photo">' + photo + num + '<h3 class="pcard-name">' + esc(p.name) + '</h3></div>' +
             '<dl class="pcard-bio">' +
               '<div><dt>Height</dt><dd>' + esc(p.ht) + '</dd></div>' +
               '<div><dt>' + (p.divisions && p.divisions.length > 1 ? 'Divisions' : 'Division') + '</dt><dd>' + esc(divisions) + '</dd></div>' +
             '</dl>' +
           '</article>';
  }

  var current = 'All';
  function render() {
    var list = TEAM.roster.filter(function (p) {
      return current === 'All' || (p.divisions || []).indexOf(current) !== -1;
    });
    $('playerGrid').innerHTML = list.map(card).join('');
    $('rosterLede').textContent = list.length + (list.length === 1 ? ' player' : ' players') +
      (current === 'All' ? ' on the Fleetwork roster.' : ' in ' + current + '.');
    Array.prototype.forEach.call($('chips').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-div') === current));
    });
  }

  $('chips').innerHTML = ['All'].concat(TEAM.divisions.map(function (d) { return d.name; })).map(function (n) {
    return '<button type="button" class="chip" data-div="' + esc(n) + '" aria-pressed="false">' + esc(n) + '</button>';
  }).join('');
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    current = b.getAttribute('data-div');
    render();
  });
  render();

  $('staffRow').innerHTML = TEAM.staff.map(function (s) {
    return '<div class="staff-card"><span class="staff-role">' + esc(s.role) + '</span><span class="staff-name">' + esc(s.name) + '</span></div>';
  }).join('');
})();
</script>
</body>
</html>
